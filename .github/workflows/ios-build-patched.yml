name: Build unsigned iOS IPA (patched)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Rust toolchain (iOS target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Apply screen orientation patch
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          CRATE="src-tauri/crates/tauritavern"


          cat > "$CRATE/src/platform/orientation.rs" <<'TT_ORIENT_RS'
          //! 屏幕方向控制（本地补丁，非上游代码）。
          //!
          //! 全部走 objc2 直接调用 UIKit，不依赖 App target 里的 C 符号，
          //! 因此不会出现链接期 undefined symbol，也不受 -dead_strip / 符号可见性影响。
          //!
          //! 注意：这里刻意使用 `*mut AnyObject` 作为接收者/返回值，而不是 `Retained<T>`。
          //! objc2 的 `msg_send!` 对 `Retained<T>` 要求 `T: Encode`，而 `AnyObject` / `NSObject`
          //! 在这种写法下都不满足（编译期 E0277）。裸指针与 Objective-C 的对象返回在 ABI 上完全一致，
          //! 这些对象生命周期都在当前调用内（主线程同步执行），不需要持有引用计数。

          #[derive(Clone, Copy, Debug, PartialEq, Eq)]
          pub enum ScreenOrientation {
              /// 跟随系统（恢复 plist 声明的三方向）
              Auto,
              Portrait,
              Landscape,
          }

          impl ScreenOrientation {
              pub fn parse(value: &str) -> Result<Self, String> {
                  match value.trim().to_ascii_lowercase().as_str() {
                      "" | "auto" | "unlock" | "system" => Ok(Self::Auto),
                      "portrait" | "vertical" => Ok(Self::Portrait),
                      "landscape" | "horizontal" => Ok(Self::Landscape),
                      other => Err(format!("unsupported screen orientation: {other}")),
                  }
              }

              pub fn code(self) -> i32 {
                  match self {
                      Self::Auto => 0,
                      Self::Portrait => 1,
                      Self::Landscape => 2,
                  }
              }

              pub fn from_code(code: i32) -> Self {
                  match code {
                      1 => Self::Portrait,
                      2 => Self::Landscape,
                      _ => Self::Auto,
                  }
              }

              #[cfg(target_os = "ios")]
              fn mask(self) -> usize {
                  // UIInterfaceOrientationMask：Portrait = 1<<1，LandscapeLeft = 1<<4，LandscapeRight = 1<<3
                  const PORTRAIT: usize = 1 << 1;
                  const LANDSCAPE: usize = (1 << 4) | (1 << 3);
                  match self {
                      Self::Portrait => PORTRAIT,
                      Self::Landscape => LANDSCAPE,
                      Self::Auto => PORTRAIT | LANDSCAPE,
                  }
              }
          }

          #[cfg(target_os = "ios")]
          mod bridge {
              use std::ffi::CStr;
              use std::sync::atomic::{AtomicI32, Ordering};

              use block2::RcBlock;
              use objc2::msg_send;
              use objc2::runtime::{AnyClass, AnyObject};
              use objc2_foundation::NSString;

              static MODE: AtomicI32 = AtomicI32::new(0);

              fn cls(name: &CStr) -> Result<&'static AnyClass, String> {
                  AnyClass::get(name).ok_or_else(|| format!("class {name:?} unavailable"))
              }

              /// 取当前处于前台活跃状态的 UIScene（iOS 13+）
              unsafe fn foreground_scene() -> Option<*mut AnyObject> {
                  let app_cls = AnyClass::get(c"UIApplication")?;
                  let app: *mut AnyObject = unsafe { msg_send![app_cls, sharedApplication] };
                  if app.is_null() {
                      return None;
                  }
                  let scenes: *mut AnyObject = unsafe { msg_send![app, connectedScenes] };
                  if scenes.is_null() {
                      return None;
                  }
                  let arr: *mut AnyObject = unsafe { msg_send![scenes, allObjects] };
                  if arr.is_null() {
                      return None;
                  }
                  let count: usize = unsafe { msg_send![arr, count] };
                  for index in 0..count {
                      let obj: *mut AnyObject = unsafe { msg_send![arr, objectAtIndex: index] };
                      if obj.is_null() {
                          continue;
                      }
                      // UISceneActivationStateForegroundActive = 0
                      let state: isize = unsafe { msg_send![obj, activationState] };
                      if state == 0 {
                          return Some(obj);
                      }
                  }
                  None
              }

              /// 必须在主线程调用
              pub fn apply(code: i32) -> Result<(), String> {
                  MODE.store(code, Ordering::SeqCst);
                  unsafe { request(super::ScreenOrientation::from_code(code)) }
              }

              unsafe fn request(orientation: super::ScreenOrientation) -> Result<(), String> {
                  let scene = unsafe { foreground_scene() }.ok_or("no active window scene")?;
                  let mask = orientation.mask();

                  // iOS 16+：geometry update，系统方向锁开着也能转
                  if let Ok(prefs_cls) = cls(c"UIWindowSceneGeometryPreferencesIOS") {
                      let alloc: *mut AnyObject = unsafe { msg_send![prefs_cls, alloc] };
                      if !alloc.is_null() {
                          let prefs: *mut AnyObject =
                              unsafe { msg_send![alloc, initWithInterfaceOrientations: mask] };
                          if !prefs.is_null() {
                              let handler = RcBlock::new(move |_error: *mut AnyObject| {});
                              let _: () = unsafe {
                                  msg_send![
                                      scene,
                                      requestGeometryUpdateWithPreferences: prefs,
                                      errorHandler: &*handler
                                  ]
                              };
                              if let Ok(vc_cls) = cls(c"UIViewController") {
                                  let _: () = unsafe { msg_send![vc_cls, attemptRotationToDeviceOrientation] };
                              }
                              return Ok(());
                          }
                      }
                  }

                  // iOS 15 及更早：KVC 改设备方向
                  let device_cls = cls(c"UIDevice")?;
                  let device: *mut AnyObject = unsafe { msg_send![device_cls, currentDevice] };
                  if device.is_null() {
                      return Err("UIDevice.currentDevice returned nil".to_string());
                  }
                  let number_cls = cls(c"NSNumber")?;
                  let value: isize = match orientation {
                      super::ScreenOrientation::Portrait => 1,   // UIInterfaceOrientationPortrait
                      super::ScreenOrientation::Landscape => 4,  // UIInterfaceOrientationLandscapeRight
                      super::ScreenOrientation::Auto => 0,       // unknown
                  };
                  let number: *mut AnyObject = unsafe { msg_send![number_cls, numberWithInteger: value] };
                  if number.is_null() {
                      return Err("NSNumber creation failed".to_string());
                  }
                  let key = NSString::from_str("orientation");
                  let _: () = unsafe { msg_send![device, setValue: number, forKey: &*key] };
                  if let Ok(vc_cls) = cls(c"UIViewController") {
                      let _: () = unsafe { msg_send![vc_cls, attemptRotationToDeviceOrientation] };
                  }
                  Ok(())
              }

              pub fn mode_code() -> i32 {
                  MODE.load(Ordering::SeqCst)
              }
          }

          #[cfg(target_os = "ios")]
          pub fn set(orientation: ScreenOrientation) -> Result<(), String> {
              bridge::apply(orientation.code())
          }

          #[cfg(not(target_os = "ios"))]
          pub fn set(orientation: ScreenOrientation) -> Result<(), String> {
              let _ = orientation;
              Err("screen orientation lock is only available on iOS".to_string())
          }

          #[cfg(target_os = "ios")]
          pub fn current() -> Result<ScreenOrientation, String> {
              Ok(ScreenOrientation::from_code(bridge::mode_code()))
          }

          #[cfg(not(target_os = "ios"))]
          pub fn current() -> Result<ScreenOrientation, String> {
              Ok(ScreenOrientation::Auto)
          }
          TT_ORIENT_RS

          cat > "$CRATE/src/presentation/commands/orientation_commands.rs" <<'TT_CMD_RS'
          //! 屏幕方向命令（本地补丁，非上游代码）。

          use tauri::AppHandle;

          use crate::platform::orientation::{self, ScreenOrientation};

          /// 锁定 / 恢复屏幕方向。
          /// `mode`: `"auto"` | `"portrait"` | `"landscape"`
          #[tauri::command]
          pub fn set_screen_orientation(app: AppHandle, mode: String) -> Result<(), String> {
              let orientation = ScreenOrientation::parse(&mode)?;
              app.run_on_main_thread(move || {
                  if let Err(error) = orientation::set(orientation) {
                      eprintln!("[orientation] set failed: {error}");
                  }
              })
              .map_err(|error| error.to_string())
          }

          /// 读取当前锁定状态。
          #[tauri::command]
          pub fn get_screen_orientation() -> Result<String, String> {
              let current = orientation::current()?;
              let value = match current {
                  ScreenOrientation::Auto => "auto",
                  ScreenOrientation::Portrait => "portrait",
                  ScreenOrientation::Landscape => "landscape",
              };
              Ok(value.to_string())
          }
          TT_CMD_RS

          python3 - "$CRATE" <<'TT_PY'
          import pathlib, sys
          crate = pathlib.Path(sys.argv[1])

          def ensure_line(path, anchor, line):
              text = path.read_text(encoding="utf-8")
              if line.strip() in text:
                  print("skip:", path.name)
                  return
              if anchor not in text:
                  raise SystemExit(f"anchor not found in {path}: {anchor!r}")
              path.write_text(text.replace(anchor, anchor + "\n" + line, 1), encoding="utf-8")
              print("patched:", path.name)

          ensure_line(crate/"src/platform/mod.rs", "pub mod lan_discovery;", "pub mod orientation;")
          ensure_line(crate/"src/presentation/commands/mod.rs", "pub mod mcp_commands;", "pub mod orientation_commands;")
          ensure_line(
              crate/"src/presentation/commands/registry.rs",
              "super::window_layout_commands::set_window_backdrop,",
              "        super::orientation_commands::set_screen_orientation,\n"
              "        super::orientation_commands::get_screen_orientation,",
          )
          TT_PY

          grep -n "orientation" "$CRATE/src/platform/mod.rs" "$CRATE/src/presentation/commands/registry.rs" | head -5

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build unsigned app (via tauri CLI)
        env:
          CI: "1"
        run: |
          set -o pipefail
          pnpm tauri ios build --no-sign --ci

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          IPA="$(find . -path ./node_modules -prune -o -name '*.ipa' -print | head -n 1)"
          if [[ -n "${IPA:-}" && -f "$IPA" ]]; then
            echo "找到 IPA: $IPA"
            cp "$IPA" TauriTavern-ios-unsigned.ipa
          else
            echo "cli 没产出 ipa，回退到手工打包 .app" >&2
            APP_DIR="$(find src-tauri -path '*/node_modules' -prune -o -name '*.app' -type d -print | head -n 1)"
            if [[ -z "${APP_DIR:-}" ]]; then
              echo "错误: 既没找到 ipa 也没找到 .app" >&2
              exit 1
            fi
            APP_NAME="$(basename "$APP_DIR" .app)"
            echo "APP_DIR=$APP_DIR"
            rm -rf stage
            mkdir -p stage/Payload
            cp -R "$APP_DIR" "stage/Payload/"
            rm -rf "stage/Payload/${APP_NAME}.app/_CodeSignature"
            ( cd stage && ditto -c -k --sequesterRsrc --keepParent "Payload/${APP_NAME}.app" "../TauriTavern-ios-unsigned.ipa" )
          fi
          ls -lh TauriTavern-ios-unsigned.ipa
          unzip -l TauriTavern-ios-unsigned.ipa | head -n 12

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TauriTavern-ios-unsigned
          path: TauriTavern-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
